# Telegram app credentials (from https://my.telegram.org)
# The git copy carries placeholders ON PURPOSE. Put your REAL values in
# bridge/config.local.properties (same KEY=VALUE format, this file is
# gitignored and never pushed) - the bridge merges it over this file.
api_id=xxxxxxxx
api_hash=yyyyyyyyyyyy

# Telethon session: created at first login, reused after
session_name=minha_sessao

# --- Groups to watch ---------------------------------------------------------------------
# ids exactly as in the web.telegram.org links. The bridge AUTOMATICALLY
# derives both real forms (migrated-group value-2^32 and channel -100+id),
# so these three links work unchanged, whatever kind of chat they are.
#
# An entry may ALSO carry its own output folder: 'id:<absolute path>'.
# Use one folder per MT5 terminal/broker: each copy of the EA (its own
# .set with InpSignalsFolder) reads only its folder, so the same
# bridge can feed several brokers at once. Entries without ':<path>'
# fall back to the global mt5_folder below.
groups=-4361070602,-3726820241,-3744710110
# two-broker example (keep everything on ONE groups= line, comma separated):
# groups=-4361070602:/home/you/.wine_mt5/drive_c/Program Files/MetaTrader 5/MQL5/Files/tg_signals,-3726820241:/home/you/mt5_alt/MQL5/Files/tg_signals

# --- log verbosity -------------------------------------------------------------
# Levels shown: fatal < error < warn < info < debug. "info" (default) shows
# start, written files and heartbeats; "debug" also shows every message
# received from watched channels.
log_level=info

# --- log colors ----------------------------------------------------------------
# always (default) = the log file also carries the ANSI color codes, so your
# terminal shows them colored with "tail -f bridge/bridge.log" (grep sees the
# raw ^[[ codes; to strip them when piping: sed 's/\x1b\[[0-9;]*m//g').
# auto = only on a terminal; never = plain text.
color=always

# --- heartbeat (proof of life) ----------------------------------------------
# Minutes between "[mt5-bridge] heartbeat: alive ..." log lines. bridge/
# start_bridge.sh and the systemd unit show them; the bridge exits on a
# clean Telegram disconnection and the service restarts it. 0 = no
# heartbeat (runs until Ctrl+C only).
heartbeat_min=10

# --- MT5 output folder -------------------------------------------------------
# Absolute path of the MT5 Files sandbox subfolder (inside the MT5 Data Folder
# shown by Help > About). Under Wine on Linux the prefix acts as the C: drive.
# Plain path with spaces is correct; escaped "\ ", duplicated "//" and a
# trailing "/" are normalized by the bridge anyway.
mt5_folder=/home/dfcastro/.wine_mt5/drive_c/Program Files/MetaTrader 5/MQL5/Files/tg_signals
